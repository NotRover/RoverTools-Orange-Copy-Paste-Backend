# Netdata httpcheck: does the API actually answer, and answer healthily?
#
# This exists because /internal/healthz returns HTTP 200 even when degraded - a dead
# Postgres or Redis shows only in the body (src/admin/router.py). A status-code check
# would stay green straight through a database outage, so both jobs match on the body.
#
# Two jobs on purpose: the pair localises a fault. `public` failing while `direct`
# passes means Caddy, TLS or DNS; both failing means the app, Postgres or Redis.
#
# NOT bind-mounted. Netdata's entrypoint copies stock config into /etc/netdata on
# every start, so a read-only mount under that path crash-loops the container.
# deploy.sh installs this file into the netdataconfig volume and restarts netdata
# only when the content changed - so it still ships from git, by the deploy.
jobs:
  - name: api_direct
    url: http://api:8000/internal/healthz
    response_match: '"status":"ok"'
    timeout: 5

  - name: api_public
    url: https://rovertools-temp.ctx.cl/internal/healthz
    response_match: '"status":"ok"'
    timeout: 10

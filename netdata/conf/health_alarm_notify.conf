# RoverTools notification config for Netdata. A MINIMAL override: alarm-notify.sh
# sources the stock file first and this one second, so anything not set here keeps
# its stock value. Installed into the netdataconfig volume by deploy/deploy.sh.
#
# No secret lives in this file. The webhook comes from ALERT_DISCORD_WEBHOOK in
# .env, passed to the container by docker-compose.prod.yml - which is what lets the
# whole notification setup be rebuilt from the repo instead of retyped by hand.
# See docs/DEPLOY.md section 12.

# Email is unusable here: OVH filters outbound SMTP (docs/DEPLOY.md section 13).
SEND_EMAIL="NO"

# The stock Discord sender works, but its message is a wall of italic prose. The
# custom sender below posts a colour-coded embed instead, so severity reads at a
# glance on a phone. Only one of the two may be on, or every alarm arrives twice.
SEND_DISCORD="NO"
SEND_CUSTOM="YES"
DEFAULT_RECIPIENT_CUSTOM="discord"

# Called once per alarm. Every variable read here is set by alarm-notify.sh before
# the call: status, old_status, name, chart, host, value_string, info, goto_url, date.
custom_sender() {
	local webhook="${ALERT_DISCORD_WEBHOOK:-}"
	[ -z "${webhook}" ] && return 1

	# Discord embed colours carry the severity, so the text itself stays plain ASCII.
	local colour headline
	case "${status}" in
		CRITICAL) colour=15158332 ; headline="CRITICAL"  ;;
		WARNING)  colour=16159744 ; headline="WARNING"   ;;
		CLEAR)    colour=3066993  ; headline="RECOVERED" ;;
		*)        colour=9807270  ; headline="${status}" ;;
	esac

	# Alarm text is arbitrary and lands inside JSON, so escape it. Pure bash: sed
	# would add a second layer of quoting to get wrong.
	_j() { local s="${1//\\/\\\\}"; s="${s//\"/\\\"}"; printf '%s' "$s" | tr '\n\r\t' '   '; }

	local nice_name desc url val cht was hst dt
	nice_name="$(_j "${name//_/ }")"
	desc="$(_j "${info:-No description}")"
	url="$(_j "${goto_url}")"
	val="$(_j "${value_string:-n/a}")"
	cht="$(_j "${chart}")"
	was="$(_j "${old_status:-UNKNOWN}")"
	hst="$(_j "${host}")"
	dt="$(_j "${date}")"

	local payload
	payload=$(cat <<JSON
{"username":"netdata","embeds":[{"title":"${headline}: ${nice_name}","description":"${desc}","color":${colour},"url":"${url}","fields":[{"name":"Value","value":"${val}","inline":true},{"name":"Chart","value":"${cht}","inline":true},{"name":"Was","value":"${was}","inline":true}],"footer":{"text":"${hst} - ${dt}"}}]}
JSON
	)

	curl -sS -m 10 -o /dev/null -X POST -H 'Content-Type: application/json' \
		-d "${payload}" "${webhook}" || return 1
	return 0
}

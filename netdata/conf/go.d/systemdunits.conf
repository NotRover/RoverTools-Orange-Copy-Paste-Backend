# The units whose state is worth an alarm, rather than every unit on the box. If the
# cgroups plugin is left collecting systemd units as well (it is not - see
# netdata.conf) this duplicates it.
jobs:
  - name: units
    include:
      - 'rovertools-*.service'
      - 'docker.service'
      - 'ssh.service'
      - 'fail2ban.service'
      - 'nftables.service'

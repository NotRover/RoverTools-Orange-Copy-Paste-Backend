# Noise trim. Netdata's defaults collect everything a machine could possibly have;
# this box is one small VPS running Docker, so most of it is charts nobody will read
# and alarms nobody will act on. Everything switched off here is either hardware we
# do not have, a filesystem we do not use, or kernel counters that are diagnostic
# rather than operational.
#
# Anything not named here keeps its default. Unknown keys are ignored by the agent,
# so a wrong guess costs nothing but leaves the noise in place - verify with the
# chart count in docs/DEPLOY.md section 12 rather than assuming.

[plugins]
	# Netdata monitoring Netdata: compression ratio, database engine pages, worker
	# thread timings, query latency. Diagnostics for the agent, telling you nothing
	# about whether the box or the app is healthy. This is the whole "Netdata
	# Monitoring" menu section.
	netdata monitoring = no
	netdata monitoring extended = no
	# Nothing here emits statsd metrics or uses eBPF tracing.
	statsd = no
	ebpf = no
	# Kernel timing jitter and clock-sync drift: interesting on a hypervisor, noise here.
	idlejitter = no
	timex = no
	# Traffic shaping (tc), perf counters and slab internals: kernel debugging surface.
	tc = no
	perf = no
	slabinfo = no
	# Legacy collector runtimes. Everything we run is go.d; these only add processes.
	charts.d = no
	python.d = no

[plugin:cgroups]
	# THE big one. The cgroups plugin builds a full chart family per systemd unit -
	# roughly 1900 charts on this box, drowning the five that matter. Docker
	# containers keep their charts; systemd units lose theirs, and unit health is
	# covered better by the deploy reporting on itself (section 12).
	enable systemd services = no

[plugin:proc]
	# Pressure stall information. Real diagnostics, but it needs a baseline to mean
	# anything and there is no capacity question here worth reading it for.
	/proc/pressure = no
	# Interrupt and softirq counters, per CPU. Kernel-tuning data.
	/proc/interrupts = no
	/proc/softirqs = no
	/proc/net/softnet_stat = no
	# Deep TCP kernel counters - out-of-order segments, SYN cookies, ECN, memory
	# pressure - and connection tracking. Real diagnostics, but meaningless without a
	# baseline to compare against, and nobody here has one.
	/proc/net/netstat = no
	/proc/net/stat/nf_conntrack = no
	# Network stacks and protocols this box does not speak.
	/proc/net/snmp6 = no
	/proc/net/sockstat6 = no
	/proc/net/sctp/snmp = no
	/proc/net/stat/synproxy = no
	/proc/net/ip_vs_stats = no
	/proc/net/rpc/nfs = no
	/proc/net/rpc/nfsd = no
	/proc/net/wireless = no
	# Storage we do not have: software RAID, ZFS, Btrfs.
	/proc/mdstat = no
	/proc/spl/kstat/zfs/arcstats = no
	/sys/fs/btrfs = no
	# Hardware a virtual machine does not have: batteries, ECC memory, Infiniband,
	# NUMA nodes, kernel page merging.
	/sys/class/power_supply = no
	/sys/class/infiniband = no
	/sys/devices/system/edac/mc = no
	/sys/devices/system/node = no
	/sys/kernel/mm/ksm = no
	# Entropy pool and SysV IPC. Neither has ever been the answer to an outage here.
	/proc/sys/kernel/random/entropy_avail = no
	ipc = no

[plugin:proc:/proc/net/dev]
	# Docker creates a bridge per compose network and a veth per container, each of
	# which becomes its own menu entry named after a hash. Only the real uplink is
	# worth a chart; container traffic is already visible per container.
	disable by default interfaces matching = lo fireqos* *-ifb fwbr* veth* docker* br-* dummy* virbr* tun* tap*

[plugin:proc:/proc/diskstats]
	# Loopback, ramdisk and device-mapper entries are not disks anyone acts on.
	exclude disks = loop* ram* dm-*

<!doctype html>
<!--
  Shared frame for every human-facing page this service serves. The router fills the
  title and body placeholders below; each page under this directory is only the
  <main> fragment, so the styling here is defined once.

  Placeholder names are never written out in these comments - the renderer replaces
  every occurrence in the file, comments included.

  The palette and type are lifted from the desktop app's own
  src/components/app/App.css, so a link opened in a browser looks like the thing
  it is about to open. Dark is the default for the same reason it is in the app;
  a browser has no data-theme to read, so light comes from prefers-color-scheme.

  Everything is inline on purpose: these pages must paint on the first response,
  because the service can be cold-starting and a second request for a stylesheet
  would be the slowest part of the page.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>__TITLE__</title>
<style>
  /* Dark theme (default) */
  :root {
    --bg: #0e0e0e;
    --surface: #181818;
    --border: #272727;
    --text: #f0f0f0;
    --text-muted: #606060;
    --accent: #ff3e1c;
    --accent-dim: #ff3e1c1a;
    --cta: #ff5535;
    --cta-hover: #ff6b4d;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f0f0f0;
      --surface: #ffffff;
      --border: #dcdcdc;
      --text: #111111;
      --text-muted: #909090;
      --accent-dim: rgba(255, 62, 28, 0.08);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%;
    max-width: 360px;
    text-align: center;
  }
  .badge {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    margin: 0 auto 11px;
    border-radius: 11px;
    color: var(--accent);
    background: var(--accent-dim);
  }
  h1 {
    margin-bottom: 5px;
    font-size: 16.5px;
    font-weight: 650;
    letter-spacing: -0.2px;
  }
  .sub { font-size: 12px; line-height: 1.45; color: var(--text-muted); }
  .code {
    margin-top: 16px;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1.5px;
    user-select: all;
  }
  .cta {
    display: inline-block;
    margin-top: 18px;
    padding: 8px 15px;
    border-radius: 8px;
    background: var(--cta);
    color: #fff;
    font-size: 12.5px;
    font-weight: 600;
    text-decoration: none;
  }
  .cta:hover { background: var(--cta-hover); }
  .cta:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .fine { margin-top: 14px; font-size: 11px; color: var(--text-muted); }
  .fine a { color: var(--text-muted); }
  .fine a:hover { color: var(--text); }
</style>
__BODY__

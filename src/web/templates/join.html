<!--
  Landing page for a space invite link: https://<base>/join/<CODE>

  Fragment only - the frame and styling come from shell.html. Two placeholders,
  filled in below: the invite code in its dashed display form, and the deep link.

  The page makes no database call. Two reasons: the service can be cold-starting
  and this has to paint immediately, and looking the code up would confirm to
  anyone whether a given code exists.
-->
<main>
  <div class="badge">
    <svg width="19" height="19" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 12.5l4-5M7.5 4.5h2a3.5 3.5 0 0 1 0 7h-2a3.5 3.5 0 0 1 0-7zM12.5 8.5h-2a3.5 3.5 0 0 0 0 7h2a3.5 3.5 0 0 0 0-7z"/>
    </svg>
  </div>

  <h1>You have an invite to a space</h1>
  <p class="sub">Spaces share clipboard items and notes between people, end to end encrypted. Open Orange Copy Paste to join.</p>

  <p class="code">__CODE__</p>

  <a class="cta" id="open" href="__DEEP_LINK__">Open in Orange Copy Paste</a>

  <p class="fine">
    Nothing happened? You can enter the code above in the app by hand, or
    <a href="https://github.com/NotRover/RoverTools-Releases/releases/latest">download Orange Copy Paste</a>.
  </p>
</main>
<script>
  // One attempt to hand the link straight to the app, so someone who has it
  // installed does not have to click twice. Guarded: if the scheme is not
  // registered the browser does nothing and the button below still works.
  try { location.replace(document.getElementById("open").href); } catch (e) {}
</script>

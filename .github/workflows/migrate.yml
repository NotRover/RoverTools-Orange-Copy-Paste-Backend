name: Migrate database

# What the run list shows. Without this every run reads "Migrate database",
# so a read-only check and an applied migration are indistinguishable until
# someone opens one - and the whole point of glancing at the list is not having
# to. `inputs` is empty on a push, which resolves to the read-only branch.
run-name: >-
  migrate ${{ github.event_name == 'push' && 'preview-sql' || inputs.action }}
  -> ${{ github.event_name == 'push' && 'head' || inputs.revision }}
  (${{ inputs.action == 'upgrade' && 'APPLIES CHANGES' || 'read-only' }})

# Render's pre-deploy hook is a paid feature, so this is how a merged Alembic
# revision reaches the database. Applying is manual: someone dispatches it and
# says which revision, on purpose.
#
# A push to main that touches migrations/ runs the preview by itself. That is
# the half worth automating - it says "a migration is pending, here is the exact
# DDL" the moment one merges, without anything reaching the database. Applying
# stays deliberate, because a migration that goes wrong unattended goes wrong
# against production, and the downgrades here are not written to be relied on.
#
# The automatic half never fails for having nothing to do. If the database is
# already at the repository head, the preview says so and succeeds: a commit that
# touches migrations/ without adding a revision must not turn the branch red.
#
# Needs one repository secret, DATABASE_URL, holding the Supabase connection
# string in the same `postgresql+asyncpg://` form the app uses. Use the session
# pooler (port 5432), not the transaction pooler (6543) - `migrations/env.py`
# builds its engine without the prepared-statement workaround that 6543 needs,
# so the guard below refuses that port rather than failing halfway through DDL.
on:
  push:
    branches: [main]
    paths:
      - "migrations/**"
  workflow_dispatch:
    inputs:
      action:
        description: >-
          What to do. Only "upgrade" touches the database; "current" and
          "preview-sql" report and change nothing. An upgrade also needs
          confirm=migrate below.
        type: choice
        default: current
        options:
          - current      # print the revision the database is on, change nothing
          - preview-sql  # print the SQL an upgrade would run, change nothing
          - upgrade      # apply it -- needs confirm=migrate
      revision:
        description: Target revision (head, or a specific one like 0015)
        type: string
        default: head
      confirm:
        description: Type "migrate" to allow the upgrade action. Ignored otherwise.
        type: string
        default: ""

# Two migrations at once would race for the alembic_version row. Queue instead,
# and never cancel a run that may be mid-DDL.
concurrency:
  group: migrate-database
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # A push carries no inputs, so it resolves to the one action that changes
      # nothing. Every step below reads these rather than `inputs.*`, so the two
      # triggers cannot drift apart.
      ACTION: ${{ github.event_name == 'push' && 'preview-sql' || inputs.action }}
      REVISION: ${{ github.event_name == 'push' && 'head' || inputs.revision }}

    steps:
      - uses: actions/checkout@v7

      - name: Check the inputs before touching anything
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::DATABASE_URL secret is not set on this repository."
            exit 1
          fi
          case "${DATABASE_URL}" in
            postgresql+asyncpg://*) ;;
            *) echo "::error::DATABASE_URL must start with postgresql+asyncpg://"; exit 1 ;;
          esac
          case "${DATABASE_URL}" in
            *:6543/*)
              echo "::error::That is the transaction pooler. Use the session pooler on port 5432."
              exit 1 ;;
          esac
          if [ "${ACTION}" = "upgrade" ] && [ "${{ inputs.confirm }}" != "migrate" ]; then
            echo "::error::Upgrade needs confirm=migrate. Nothing has been run."
            {
              echo '### Refused'
              echo ''
              echo 'An upgrade needs `confirm=migrate`. Nothing has been run, and'
              echo 'the database is untouched.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # No floating `v10` tag exists - this project ships immutable releases
      # only (v8.0.0 onward), so the pin is the full version.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true

      # --frozen so a resolver nudge in CI cannot quietly install something the
      # lockfile does not name. --no-dev: migrations need no test dependencies.
      - name: Install
        run: uv sync --frozen --no-dev

      # Parsed from the plain output, not `--verbose`: the verbose form opens with
      # a "Current revision(s) for ..." header, and taking its first field gave
      # the literal word `Current`, which every preview then failed on. Plain
      # output is one line, `<rev> (head)`, and empty when the database has no
      # alembic_version row at all. Alembic's own logging goes to stderr (see
      # alembic.ini), so stdout is only the answer.
      - name: Where the database is now
        id: current
        run: |
          # Read the two revisions as their own commands rather than piping
          # alembic straight into awk. A pipeline hides alembic's exit code, and
          # what it hid here was a connection failure: an unreachable database
          # produced an empty revision, which the rest of this step then reported
          # as "no alembic_version row, everything pending" - a confident,
          # green, entirely wrong answer.
          if ! CURRENT_OUT=$(uv run alembic current); then
            echo "::error::Could not read the database revision. Nothing has been run."
            {
              echo '### Could not reach the database'
              echo ''
              echo 'The revision could not be read, so this run reports nothing about'
              echo 'the schema. Check `DATABASE_URL` in the repository secrets.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          CURRENT=$(awk 'NF {print $1; exit}' <<< "${CURRENT_OUT}")
          HEAD=$(uv run alembic heads | awk 'NF {print $1; exit}')
          echo "revision=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "head=${HEAD}" >> "$GITHUB_OUTPUT"
          echo "database: ${CURRENT:-<no alembic_version row>}, repository head: ${HEAD}"

          # Written on every path, including the read-only ones. A run that
          # reports nothing is indistinguishable from a run that did the job,
          # and that is not hypothetical: `current` was dispatched during an
          # outage, went green, printed only into the log, and the outage was
          # left in place because the run looked like the fix.
          {
            echo '### Where things stand'
            echo ''
            echo '| | |'
            echo '|---|---|'
            echo '| Database | `'"${CURRENT:-no alembic_version row}"'` |'
            echo '| Repository head | `'"${HEAD}"'` |'
            echo '| This run | `'"${ACTION}"'` to `'"${REVISION}"'` |'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${CURRENT}" ] && [ "${CURRENT}" = "${HEAD}" ]; then
            {
              echo ''
              echo 'Nothing pending.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo ''
            echo '### Pending'
            echo ''
            echo '```'
            uv run alembic history -r "${CURRENT:-base}:head"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # The line that would have saved the outage. A read-only run that
          # finds work has to hand over the exact way to do it, rather than
          # leaving the reader to remember which of three options applies.
          if [ "${ACTION}" != "upgrade" ]; then
            echo "::warning::A migration is pending and this ${ACTION} run changed nothing. Re-dispatch with action=upgrade, revision=head, confirm=migrate to apply it."
            {
              echo ''
              echo '> **This run changed nothing.** To apply the revisions above:'
              echo ''
              echo '```bash'
              echo 'gh workflow run migrate.yml -f action=upgrade -f revision=head -f confirm=migrate \'
              echo '  --repo '"${GITHUB_REPOSITORY}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Nothing pending is the normal case for a push, so it is a notice and a
      # success, never a failure. A commit that touches migrations/ without
      # adding a revision - a docstring, a comment, this file's own siblings -
      # must not turn the branch red.
      - name: Preview the SQL
        if: env.ACTION == 'preview-sql'
        run: |
          FROM='${{ steps.current.outputs.revision }}'
          HEAD='${{ steps.current.outputs.head }}'
          if [ -z "$FROM" ]; then
            echo "::notice::The database has no alembic_version row, so there is nothing to diff from. Run an upgrade from base deliberately, not from a preview."
            echo '### No preview' >> "$GITHUB_STEP_SUMMARY"
            echo 'The database has no `alembic_version` row yet.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$FROM" = "$HEAD" ]; then
            echo "::notice::Database is already at ${FROM}. No migration pending."
            {
              echo '### No migration pending'
              echo ''
              echo 'The database is already at `'"$FROM"'`.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '### SQL for `'"$FROM"'` -> `'"$REVISION"'`'
            echo '```sql'
            uv run alembic upgrade "$FROM:${REVISION}" --sql
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upgrade
        if: env.ACTION == 'upgrade'
        run: uv run alembic upgrade "${REVISION}"

      # Alembic's exit code is not the whole answer, and a green run that did
      # not migrate is the worst outcome this workflow can produce: it reads as
      # "the schema is fine", so the next place anyone looks is the application.
      - name: Confirm it landed
        if: env.ACTION == 'upgrade'
        run: |
          NOW=$(uv run alembic current | awk 'NF {print $1; exit}')
          WANT="${REVISION}"
          if [ "${WANT}" = "head" ]; then
            WANT='${{ steps.current.outputs.head }}'
          fi
          {
            echo '### Applied'
            echo ''
            echo '| | |'
            echo '|---|---|'
            echo '| Was | `'"${{ steps.current.outputs.revision }}"'` |'
            echo '| Now | `'"${NOW}"'` |'
            echo '| Asked for | `'"${WANT}"'` |'
            echo ''
            echo '```'
            uv run alembic current --verbose
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${NOW}" != "${WANT}" ]; then
            echo "::error::The upgrade reported success but the database is at ${NOW}, not ${WANT}."
            exit 1
          fi

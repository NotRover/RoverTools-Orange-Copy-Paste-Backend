name: CI

# The test suite needs a real Postgres (the fixtures build the schema with
# drop_all/create_all), which is why it never ran on a dev machine without one.
# A service container gives every push the database it was missing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clipboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Both are pinned at the service container. TEST_DATABASE_URL is what the
      # fixtures use; DATABASE_URL matters because src.database builds its
      # engine at import time, and anything that reaches for it during a test
      # must land here rather than on a configured deployment.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/clipboard_test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/clipboard_test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python and dependencies
        # pytest lives in the `dev` extra; ruff and ty are not project dependencies,
        # so they run as uv tools below.
        run: uv sync --frozen --extra dev

      - name: Lint
        # Pinned: ruff 0.16 widened its default rule set, which this code is not
        # written to. Bump deliberately, together with any fixes it asks for.
        run: uvx ruff@0.15.12 check src tests

      - name: Types
        run: uvx ty@0.0.34 check src

      - name: Tests
        run: uv run pytest -q

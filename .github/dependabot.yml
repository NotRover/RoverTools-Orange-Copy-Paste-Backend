# Dependabot for the backend. Security updates are switched on in the repo
# settings and ignore the schedule below; this file sets the weekly version
# updates for the uv lockfile, the base image and the workflows.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      python-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]

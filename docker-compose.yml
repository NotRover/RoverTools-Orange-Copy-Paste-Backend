# Local development stack.
#
# In production the API talks to Supabase (Postgres + Auth) and a managed Redis
# (e.g. Upstash) — only the `api` service is deployed, scaled horizontally behind
# a load balancer. The `db` and `redis` services below exist purely for local dev.
services:
  api:
    build: .
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/clipboard
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
    working_dir: /app

  # Local Postgres — stand-in for Supabase Postgres during development.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clipboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis — pub/sub fan-out + device presence.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  redis_data:

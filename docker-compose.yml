# Local development stack.
#
# Production is a separate file (docker-compose.prod.yml): Caddy + the API + a
# co-located Redis on the VPS, with Supabase (Postgres + Auth) external. The `db`,
# `minio`, and `redis` services below exist purely for local dev.
services:
  api:
    build: .
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/clipboard
      REDIS_URL: redis://redis:6379/0
      # Point the API's own S3 calls (e.g. delete_object) at the in-network MinIO.
      # NOTE: presigned upload/download URLs the API hands to clients will contain
      # this host (`minio`), which a desktop client on your host CANNOT resolve.
      # For end-to-end blob testing from the host app, run the API on the host
      # instead (`uv run uvicorn ...`) with S3_ENDPOINT_URL=http://localhost:9000 —
      # it hits the same MinIO published below, but signs host-reachable URLs.
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: clipboard-blobs
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: auto
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app

  # Local Postgres — stand-in for Supabase Postgres during development.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clipboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis — pub/sub fan-out + device presence.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # MinIO — S3-compatible blob store, stand-in for Cloudflare R2 during dev.
  # Console at http://localhost:9001 (login minioadmin / minioadmin).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: create the blob bucket, then exit. Runs after MinIO is healthy so
  # the API never presigns against a missing bucket.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/clipboard-blobs &&
      echo 'bucket clipboard-blobs ready'
      "

volumes:
  pg_data:
  redis_data:
  minio_data:

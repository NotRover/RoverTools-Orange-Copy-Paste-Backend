[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orange-clipboard-backend"
version = "0.1.0"
description = "Smart Clipboard backend — cloud sync, realtime sharing, E2E encryption"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis[hiredis]>=5.0",
    "boto3>=1.34",
    # [crypto] pulls in `cryptography`, required to verify Supabase's asymmetric
    # (ES256/RS256) access tokens.
    "pyjwt[crypto]>=2.9",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "slowapi>=0.1.9",
    "email-validator>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "anyio>=4.0",
    "fakeredis>=2.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
